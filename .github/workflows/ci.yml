name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: holepunchto/actions/security-base@v1
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: npm t
      - run: npm run test:bare
